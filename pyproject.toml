[project]
name = "recon-agent"
version = "0.1.0"
description = "AI-assisted reconciliation of Razorpay settlements, bank statements and orders for small merchants"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Allumolu Sai Jayanth" }]
dependencies = ["pandas>=2.1", "openpyxl>=3.1", "streamlit>=1.40"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]  # formatter owns line length; long user-facing strings stay whole
