[server]
enableStaticServing = true   # serves ./static, so the fonts ship with the app

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[theme]
base = "light"
primaryColor = "#0D5C42"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F8"
textColor = "#15181E"
linkColor = "#0D5C42"
borderColor = "#E3E6EA"
showWidgetBorder = true
baseRadius = "8px"
font = "IBM Plex Sans, system-ui, sans-serif"
codeFont = "IBM Plex Mono, ui-monospace, monospace"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Variable.woff2"
weight = "100 700"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Regular.woff2"
weight = "400"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Medium.woff2"
weight = "500"
